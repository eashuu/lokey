name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir app install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir app typecheck
      - name: Build
        run: pnpm --dir app build
      - name: Self-checks
        shell: bash
        run: |
          cd app
          node_modules/.bin/electron . --selfcheck || true
          cat "$LOCALAPPDATA/Lokey/selfcheck.txt"
          ! grep -q FAIL "$LOCALAPPDATA/Lokey/selfcheck.txt"
      - name: Gateway guard (no provider call outside the gateway)
        run: pnpm --dir app check:gateway
      - name: Injection suite (mock model, headless, no key)
        shell: bash
        run: |
          cd app
          node_modules/.bin/electron . --eval || true
          cat "$LOCALAPPDATA/Lokey/eval-injection.txt"
          read stopped total < <(grep -Eo 'attacks stopped [0-9]+/[0-9]+' "$LOCALAPPDATA/Lokey/eval-injection.txt" | grep -Eo '[0-9]+' | tr '\n' ' ')
          test -n "$total" && test "$stopped" = "$total"
      - name: Phone bundle
        run: |
          pnpm --dir app mobile:web
          pnpm --dir app mobile:check

  sidecar:
    name: Sidecar (.NET build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build native/Lokey.Host -c Release
      - name: Self-test
        run: dotnet run --project native/Lokey.Host -c Release -- --selftest
      - name: UI Automation fixture (pure, touches no window)
        shell: bash
        run: |
          dotnet run --project native/Lokey.Host -c Release -- --uia-fixture app/evals/uia/notepad-save-as.raw.json > "$RUNNER_TEMP/tree.json"
          node -e "const a=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8').replace(/^﻿/,''));const b=JSON.parse(require('fs').readFileSync('app/evals/uia/notepad-save-as.tree.json','utf8').replace(/^﻿/,''));if(JSON.stringify(a)!==JSON.stringify(b)){console.error('the recorded tree no longer matches the sidecar output');process.exit(1)}" "$RUNNER_TEMP/tree.json"
