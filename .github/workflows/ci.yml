name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir app install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir app typecheck
      - name: Build
        run: pnpm --dir app build
      - name: Self-checks
        shell: bash
        run: |
          cd app
          node_modules/.bin/electron . --selfcheck || true
          cat "$LOCALAPPDATA/Lokey/selfcheck.txt"
          ! grep -q FAIL "$LOCALAPPDATA/Lokey/selfcheck.txt"

  sidecar:
    name: Sidecar (.NET build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build native/Lokey.Host -c Release
      - name: Self-test
        run: dotnet run --project native/Lokey.Host -c Release -- --selftest
